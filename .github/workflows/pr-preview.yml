# Builds every pull request and publishes it to GitHub Pages under pr-preview/pr-<number>/,
# then comments the link on the PR and adds a "View deployment" button. The preview is removed
# when the PR is closed or merged.
#
# Previews live on the gh-pages branch next to the main preview (see pages.yml). One-time setup:
# Settings → Pages → Build and deployment → Source: "Deploy from a branch", branch gh-pages, / (root).
#
# PRs from forks get no preview: their GITHUB_TOKEN is read-only, by design.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write # push to gh-pages
  pages: read # look up the Pages URL and wait for the Pages build
  pull-requests: write # comment the preview link

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Shows a "View deployment" button on the PR
    environment:
      name: pr-preview
      url: ${{ steps.preview.outputs.preview-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        id: build
        uses: ./.github/actions/build-site
        with:
          folder: pr-preview/pr-${{ github.event.number }}
          # Real module data from the first build, whatever production last published
          moonbase-index: 'true'

      - name: Publish the preview
        id: preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          action: deploy
          source-dir: .output/public
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          # For the link; it handles custom domains too.
          pages-base-url: ${{ steps.build.outputs.pages-host-path }}
          # Comment only once the preview is live, so the link never 404s.
          wait-for-pages-deployment: true

  remove:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # The deploy action used inside pr-preview-action works from a checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove the preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          action: remove
          preview-branch: gh-pages
          umbrella-dir: pr-preview
