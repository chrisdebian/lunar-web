# Publishes a preview of main to the root of the GitHub Pages site on every push to main, daily,
# and within the hour after the moonbase changes (for the /modules pages).
# PR previews (pr-preview.yml) live in pr-preview/ on the same gh-pages branch and are left alone.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "Deploy from a branch",
# branch gh-pages, / (root). The branch is created by the first run of this workflow.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily, so the moonbase arrivals board on the homepage stays fresh
    - cron: '23 5 * * *'
    # Hourly, rebuilding only if a moonbase repository changed since the published module index
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write # push to gh-pages
  pages: read # look up the Pages URL

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The hourly run deploys only when the moonbase moved on; every other run always deploys.
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.compare.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.schedule == '47 * * * *'
        with:
          sparse-checkout: |
            /.nvmrc
            /scripts/moonbase-index.mjs
            /scripts/lib/
            /server/utils/moonbase.ts
            /shared/types/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event.schedule == '47 * * * *'
        with:
          node-version-file: .nvmrc

      - name: Did the moonbase change?
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          HOURLY: ${{ github.event.schedule == '47 * * * *' }}
        run: |
          if [ "$HOURLY" != true ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pages_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          result=$(node scripts/moonbase-index.mjs --compare "${pages_url%/}/modules/index.json")
          echo "$result"
          if [ "$result" = unchanged ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        uses: ./.github/actions/build-site
        with:
          moonbase-index: 'true'

      # Pages runs Jekyll on branch deploys, which would drop _nuxt/ and __nuxt_content/.
      - run: touch .output/public/.nojekyll

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: .output/public
          # Keep the PR previews, and rebase instead of force-pushing over them.
          clean-exclude: pr-preview/
          force: false
          commit-message: Deploy main ${{ github.sha }}
