name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build and check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Check content
        run: yarn check-content

      - name: Generate (root, production URL)
        run: yarn generate

      - name: Check links (root)
        run: yarn check-links

      - name: Generate (sub-path, as on GitHub Pages)
        run: yarn generate
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          NUXT_PUBLIC_SITE_URL: https://example.org/${{ github.event.repository.name }}/

      - name: Check links (sub-path)
        run: yarn check-links
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          NUXT_PUBLIC_SITE_URL: https://example.org/${{ github.event.repository.name }}/

  external-links:
    name: External links (informational)
    runs-on: ubuntu-latest
    # Third-party sites go down for reasons outside this repo; report, don't block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn generate
      - run: yarn check-links --external

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lunar-www:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name web -p 8080:80 lunar-www:ci
          for _ in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          for path in / /news /docs /docs/faq /rss.xml /sitemap.xml /search.json; do
            curl -fsS -o /dev/null "http://localhost:8080$path" || { echo "::error::$path failed"; exit 1; }
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/does-not-exist)" = 404
          docker rm -f web
