name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build and check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Check content
        run: yarn check-content

      - name: Generate (root, production URL)
        run: yarn generate
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check links (root)
        run: yarn check-links

      - name: Generate (sub-path, as on GitHub Pages)
        run: yarn generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          NUXT_PUBLIC_SITE_URL: https://example.org/${{ github.event.repository.name }}/

      - name: Check links (sub-path)
        run: yarn check-links
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          NUXT_PUBLIC_SITE_URL: https://example.org/${{ github.event.repository.name }}/

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: lunar-www:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name web -p 8080:80 lunar-www:ci
          for _ in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          for path in / /news /docs /docs/faq /rss.xml /sitemap.xml /search.json; do
            curl -fsS -o /dev/null "http://localhost:8080$path" || { echo "::error::$path failed"; exit 1; }
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/does-not-exist)" = 404
          docker rm -f web
